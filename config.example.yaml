# 复制为 config.yaml 后改 3 个地方就能用（带 ★ 的）。
# 相对路径以本文件所在目录为基准。

output_dir: ~/hermes-media-output   # 生成的图片 / 音频都放这里

web:
  port: 8765            # 界面地址 http://127.0.0.1:8765
  open_browser: true    # 启动后自动打开浏览器
  preload: true         # 启动界面时就在后台加载两个模型，第一次出图/配音不用等

image:
  backend: local        # local：直接跑千问 Image 2.1（不需要 ComfyUI）
  local:
    # ★1 装好 torch + diffusers 的 Python。可以是 "python"、"uv run python"、
    #     或者整合包里的完整路径，例如 "D:/qwen-image/python/python.exe"
    python: python
    # ★2 你已经有的千问 Image 2.1 模型目录（没有的话可以留着，用界面「📦 模型」一键下载）
    model: D:/models/Qwen-Image-2.1
    device: cuda
    dtype: bfloat16
    offload: false      # 显存不够（官方版 BF16 约需 32G）时改成 true，会慢一些；或改用 GGUF 量化版
    port: 7862

  # 「📦 模型」界面下载的模型放这里（官方版约 30GB，留足空间）
  models_dir: D:/models/hermes-media
  download_source: hf-mirror   # huggingface | hf-mirror（国内镜像）| modelscope（需 pip install modelscope）
  default_model: ""            # 留空 = 上面的 model；也可以写模型管理里的名称或 id

  # 手动添加别的模型（可选），会出现在「模型」下拉框里：
  # models:
  #   - name: 我的 LoRA 版
  #     model: D:/models/Qwen-Image-2.1        # 基础模型（diffusers 目录）
  #     transformer: D:/models/xxx-Q8_0.gguf   # 可选：替换扩散模型（.gguf / .safetensors）
  #     text_encoder: D:/models/xxx-encoder    # 可选：替换文本编码器
  #     lora: D:/loras/xxx.safetensors         # 可选：LoRA
  #     lora_scale: 0.8
  steps: 50             # 默认步数（界面里每次都能改）
  cfg: 4.0
  default_ratio: "1:1"

tts:
  backend: local        # local：直接跑 IndexTTS2（不需要 ComfyUI）
  local:
    # ★3 你本地 index-tts 仓库 / 整合包的目录（里面有 indextts/ 和 checkpoints/）
    index_tts_dir: D:/index-tts
    # 在上面目录里运行 Python 的方式：官方仓库用 "uv run python"；
    # 整合包一般写它自带的 python，例如 "D:/index-tts/python/python.exe"
    python: uv run python
    model_dir: checkpoints
    version: "2"        # IndexTTS2.5 改成 "2.5"
    port: 7861
  voices_dir: voices    # 参考音色目录（界面里「上传音色」也存到这里）
  default_voice: ""     # 留空 = 列表第一个

# 风格 / 音色 / 情绪预设在 presets/ 目录下的 YAML 里，随便改，刷新界面就生效。
presets_dir: presets

# ---- 下面是可选的其它后端，一般用不到 ----
# image.backend: openai   → 任何 OpenAI 兼容出图接口（/v1/images/generations）
# image.backend: comfyui  → 已有 ComfyUI 时，用 workflows/ 里导出的 API 工作流
#   ComfyUI 里已经有千问 Image 2.1 的模型文件，就不用再下载，例如：
#   image:
#     backend: comfyui
#     comfyui:
#       url: http://127.0.0.1:8188      # 你的 ComfyUI 地址（桌面版默认端口可能是 8000）
#       unet: qwen_image_2.1_int8_convrot.safetensors   # models/diffusion_models 下的文件名
#       clip: qwen3vl_8b_int8_convrot.safetensors       # models/text_encoders 下的文件名
#       vae: qwen_image_2.1_vae_bf16.safetensors        # models/vae 下的文件名
# tts.backend:   openai   → OpenAI 兼容的 /v1/audio/speech
