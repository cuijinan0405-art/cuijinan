<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes Media</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f8cff'/%3E%3Ccircle cx='11' cy='16' r='4' fill='white'/%3E%3Ccircle cx='22' cy='10' r='3' fill='white'/%3E%3Ccircle cx='22' cy='22' r='3' fill='white'/%3E%3Cpath d='M11 16L22 10M11 16L22 22' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/vendor/litegraph.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">Hermes&nbsp;Media <span>出图 · 配音</span></div>
  <div class="templates" role="group" aria-label="预设工作流">
    <button data-tpl="image" class="tpl">🖼 出图</button>
    <button data-tpl="tts" class="tpl">🎙 配音</button>
    <button data-tpl="both" class="tpl">✨ 图文同出</button>
  </div>
  <div class="spacer"></div>
  <div id="status" class="status"></div>
  <button id="open-models" class="ghost" title="下载 / 切换出图模型">📦 模型</button>
  <button id="run" class="run" title="Ctrl + Enter">▶ 运行</button>
  <button id="toggle-side" class="ghost" title="显示/隐藏结果">结果</button>
</header>
<div id="progress"><div></div></div>
<main>
  <div id="canvas-wrap"><canvas id="graph"></canvas>
    <div id="hint">滚轮缩放 · 拖空白处平移 · 右键或双击空白处添加节点 · 从圆点拖线连接</div>
  </div>
  <aside id="side">
    <div class="side-head"><b>结果</b><button id="refresh-history" class="ghost small">历史记录</button></div>
    <div id="results"><p class="empty">选一个上方的预设，改改文字和选项，点「运行」。</p></div>
  </aside>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-card">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-cancel" class="ghost">取消</button>
      <button id="modal-ok" class="run">确定</button>
    </div>
  </div>
</div>
<div id="lightbox" hidden><img alt=""></div>
<div id="toast" hidden></div>

<script src="/static/vendor/litegraph.core.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
