[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-media"
version = "0.1.0"
description = "本地出图（千问 Qwen-Image 2.1）/ 配音（IndexTTS2）节点工作台，带 Hermes Agent MCP 接入"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.10",
    "httpx>=0.27",
    "pyyaml>=6",
    "huggingface_hub>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
modelscope = ["modelscope"]

[project.scripts]
hermes-media = "hermes_media.cli:main"

[tool.setuptools]
packages = ["hermes_media"]

[tool.setuptools.package-data]
hermes_media = ["web/*", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
