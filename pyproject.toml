[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-media"
version = "0.1.0"
description = "让 Hermes Agent 一句话出图（千问 Qwen-Image 2.1）/ 一句话配音（IndexTTS2）的本地 MCP 工具"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.10",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hermes-media = "hermes_media.cli:main"

[tool.setuptools]
packages = ["hermes_media"]

[tool.pytest.ini_options]
testpaths = ["tests"]
